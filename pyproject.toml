[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fileflow"
version = "1.0.0"
description = "Deterministic folder organizer with dry-run planning, duplicate detection and CSV reports."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "FileFlow contributors" }]
keywords = ["files", "automation", "organization", "duplicate-detection", "cli"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
fileflow = "fileflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
